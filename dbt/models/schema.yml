version: 2

models:
  - name: stg_trips
    description: "One received trip row with source text cast to analytical types and blank text normalized to null."
    columns:
      - name: ride_id
        description: "Trip identifier as supplied by Divvy after blank normalization."
      - name: started_at
        description: "Parsed trip start timestamp; null when the source value is not parseable."
      - name: ended_at
        description: "Parsed trip end timestamp; null when the source value is not parseable."
      - name: source_month
        description: "Selected YYYYMM source partition."
      - name: source_file
        description: "Cached ZIP filename that supplied the row."
  - name: stg_stations
    description: "One GBFS snapshot station object with selected JSON attributes extracted for later enrichment."
    columns:
      - name: station_json
        description: "Complete GBFS station object preserved for source lineage."
      - name: station_id
        description: "GBFS station identifier, kept separate from historical trip station IDs."
        tests:
          - unique
          - not_null
      - name: station_name
        description: "Current GBFS station name used later for conservative matching."
      - name: snapshot_updated_at
        description: "Timestamp converted from the GBFS snapshot epoch metadata."

  - name: dim_station
    description: "One historical endpoint station identity, enriched from the current GBFS snapshot only when name matching is unambiguous."
    columns:
      - name: station_key
        description: "Deterministic historical station key or the reserved unknown key."
        tests:
          - unique
          - not_null
      - name: matching_status
        description: "Result of conservative historical-name matching against the current GBFS snapshot."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched', 'unmatched', 'ambiguous', 'unknown']

  - name: dim_date
    description: "One calendar date observed in valid trip start or end timestamps."
    columns:
      - name: date_key
        description: "Calendar date in YYYYMMDD integer form."
        tests:
          - unique
          - not_null

  - name: fct_trips
    description: "One retained trip per supplied ride identifier, with station and start-date dimension references."
    columns:
      - name: ride_id
        description: "Supplied trip identifier and fact grain."
        tests:
          - unique
          - not_null
      - name: rideable_type
        description: "Bike type supplied by Divvy for the trip."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['classic_bike', 'electric_bike']
      - name: member_casual
        description: "Rider segment supplied by Divvy."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['member', 'casual']
      - name: start_station_key
        description: "Starting historical station identity, or unknown when the source ID is missing."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_key
      - name: end_station_key
        description: "Ending historical station identity, or unknown when the source ID is missing."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_key
      - name: start_date_key
        description: "Calendar date of the trip start timestamp."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: end_date_key
        description: "Calendar date of the trip end timestamp when it is available."
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: duration_is_valid
        description: "Whether the original interval is positive and no longer than 24 hours."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: mart_station_demand
    description: "One starting station and rider segment over the loaded months, for comparing station demand."
    columns:
      - name: mart_key
        description: "Deterministic key for the station and rider-segment grain."
        tests:
          - not_null
          - unique
      - name: station_key
        description: "Starting station reference, including the reserved unknown station."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_key
      - name: member_casual
        description: "Rider segment at the mart grain."
        tests:
          - not_null

  - name: mart_usage_patterns
    description: "One weekday, start hour, and rider segment over the loaded months, for comparing usage timing."
    columns:
      - name: mart_key
        description: "Deterministic key for the weekday, hour, and rider-segment grain."
        tests:
          - not_null
          - unique
      - name: day_of_week
        description: "DuckDB weekday number for the trip start date."
        tests:
          - not_null
      - name: start_hour
        description: "Hour of day extracted from the trip start timestamp."
        tests:
          - not_null
      - name: member_casual
        description: "Rider segment at the mart grain."
        tests:
          - not_null

  - name: mart_bike_mix
    description: "One bike type and rider segment over the loaded months, for comparing observed bike mix."
    columns:
      - name: mart_key
        description: "Deterministic key for the bike-type and rider-segment grain."
        tests:
          - not_null
          - unique
      - name: rideable_type
        description: "Bike type at the mart grain."
        tests:
          - not_null
      - name: member_casual
        description: "Rider segment at the mart grain."
        tests:
          - not_null
