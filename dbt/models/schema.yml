version: 2

models:
  - name: stg_trips
    description: "One received trip row with source text cast to analytical types and blank text normalized to null."
    columns:
      - name: ride_id
        description: "Trip identifier as supplied by Divvy after blank normalization."
      - name: started_at
        description: "Parsed trip start timestamp; null when the source value is not parseable."
      - name: ended_at
        description: "Parsed trip end timestamp; null when the source value is not parseable."
      - name: source_month
        description: "Selected YYYYMM source partition."
      - name: source_file
        description: "Cached ZIP filename that supplied the row."
  - name: stg_stations
    description: "One GBFS snapshot station object with selected JSON attributes extracted for later enrichment."
    columns:
      - name: station_json
        description: "Complete GBFS station object preserved for source lineage."
      - name: station_id
        description: "GBFS station identifier, kept separate from historical trip station IDs."
      - name: station_name
        description: "Current GBFS station name used later for conservative matching."
      - name: snapshot_updated_at
        description: "Timestamp converted from the GBFS snapshot epoch metadata."

  - name: dim_station
    description: "One historical endpoint station identity, enriched from the current GBFS snapshot only when name matching is unambiguous."
    columns:
      - name: station_key
        description: "Deterministic historical station key or the reserved unknown key."
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "One calendar date observed in valid trip start or end timestamps."
    columns:
      - name: date_key
        description: "Calendar date in YYYYMMDD integer form."
        tests:
          - unique
          - not_null

  - name: fct_trips
    description: "One retained trip per supplied ride identifier, with station and start-date dimension references."
    columns:
      - name: ride_id
        description: "Supplied trip identifier and fact grain."
        tests:
          - unique
          - not_null
      - name: start_station_key
        description: "Starting historical station identity, or unknown when the source ID is missing."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_key
      - name: end_station_key
        description: "Ending historical station identity, or unknown when the source ID is missing."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_key
      - name: start_date_key
        description: "Calendar date of the trip start timestamp."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: end_date_key
        description: "Calendar date of the trip end timestamp when it is available."
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
